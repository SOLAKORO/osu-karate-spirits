<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>押忍！空手スピリッツ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column, a night dojo — indigo boards, vermilion for action, belt colours as status. */
:root{
  color-scheme:dark;
  --bg:#121829; --panel:#1c243d; --panel2:#262f50; --line:#36406a;
  --fg:#f3eee3; --mute:#a3a9c2; --shu:#e5483a; --shu2:#ff6b55; --gold:#e9b949; --silver:#9fc3e6; --bronze:#c98a55;
  --t-go:#e5483a; --t-soku:#3fb6e0; --t-ju:#7fcf74; --t-shin:#b48cf0; --t-tai:#f0a03c; --t-sup:#9aa3bf;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;
  background-image:repeating-linear-gradient(90deg,transparent 0 118px,rgba(255,255,255,.025) 118px 120px);}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-weight:700}
.btn:hover{border-color:var(--mute)}
.btn.main{background:var(--shu);border-color:var(--shu);color:#fff;font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.06em}
.btn.main:hover{background:var(--shu2)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:7px 11px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 0;min-width:120px}
.mute{color:var(--mute)}
.small{font-size:12.5px}
.label{font-size:11px;letter-spacing:.12em;color:var(--mute);font-weight:700}

/* title */
.hero{text-align:center;padding:22px 8px 8px}
.hero .kicker{font-size:12px;letter-spacing:.3em;color:var(--gold);font-weight:700}
.hero h1{font-size:clamp(30px,9vw,46px);line-height:1.15;margin:10px 0 6px}
.hero h1 em{font-style:normal;color:var(--shu)}
.hero .sub{color:var(--mute);font-size:13px}
.emblem{width:112px;height:112px;margin:18px auto 4px;border-radius:50%;border:3px solid var(--fg);display:grid;place-items:center;font-family:var(--display);font-size:46px;position:relative}
.emblem::after{content:"";position:absolute;left:-14px;right:-14px;top:52%;height:12px;background:#111;border:2px solid var(--fg);border-radius:3px;transform:rotate(-8deg)}
.menu{display:flex;flex-direction:column;gap:10px}
.stones{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.stones::before{content:"";width:12px;height:12px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
.topbar{display:flex;justify-content:flex-end;gap:8px}

/* avatars & cards */
.av{--s:34px;width:var(--s);height:var(--s);border-radius:50%;display:inline-block;flex:none;border:2px solid rgba(0,0,0,.35);position:relative;overflow:hidden}
.av svg{width:100%;height:100%;display:block}
.av img.face{display:block;width:150%;max-width:none;margin:4% 0 0 -25%}
img.bustph{display:block;width:130%;max-width:none;margin:2% 0 0 -15%}
.vn .bust img.bustph{width:150px;height:150px;object-fit:cover;object-position:50% 0;margin:0;animation:slidein .3s both}
img.full{display:block;width:100%;height:100%;object-fit:contain;object-position:50% 100%}
.pick .pfig img.full{width:100%;height:100%}
.av.me{border-color:var(--fg)}
.t-go{background:var(--t-go);color:#fff}.t-soku{background:var(--t-soku)}.t-ju{background:var(--t-ju)}.t-shin{background:var(--t-shin)}.t-tai{background:var(--t-tai)}.t-sup{background:var(--t-sup)}
.t-me{background:var(--fg);color:var(--shu)}.t-me2{background:#ffc0d0;color:#8a1838}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{position:relative;display:flex;gap:9px;align-items:center;padding:9px 10px;border-radius:8px;background:var(--panel2);border:2px solid var(--line);text-align:left;min-width:0;width:100%}
.card .nm{font-weight:700;font-size:13.5px;line-height:1.3}
.card .meta{font-size:11px;color:var(--mute)}
.card .info{min-width:0}
.card.SSR{border-color:var(--gold);background:linear-gradient(135deg,rgba(233,185,73,.2),var(--panel2) 60%)}
.card.SR{border-color:var(--silver)}
.card.R{border-color:var(--bronze)}
.card.on{outline:3px solid var(--shu);outline-offset:1px}
.card.dim{opacity:.38;filter:grayscale(.8)}
.card .rar{position:absolute;top:4px;right:6px;font-family:var(--display);font-size:11px}
.SSR .rar{color:var(--gold)}.SR .rar{color:var(--silver)}.R .rar{color:var(--bronze)}.N .rar{color:var(--mute)}
.card .lb{font-size:10.5px;color:var(--gold)}
.card .new{position:absolute;bottom:4px;right:6px;font-size:10px;font-weight:700;color:var(--shu2)}
.reveal{animation:pop .45s both}
@keyframes pop{from{transform:scale(.6) rotateY(80deg);opacity:0}to{transform:none;opacity:1}}

/* character select */
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border-radius:12px;background:var(--panel2);border:2px solid var(--line)}
.pick.on{border-color:var(--shu);background:#3a2433}
.pick .pfig{width:120px;height:150px;display:block}.pick .pfig svg{width:100%;height:100%}
.pick b{font-family:var(--display);font-weight:400;font-size:18px}
.looks{display:flex;flex-wrap:wrap;gap:8px}
.look{display:flex;flex-direction:column;align-items:center;gap:3px;width:64px;font-size:10.5px;color:var(--mute);text-align:center;line-height:1.2}
.look.on .av{outline:3px solid var(--shu);outline-offset:2px}

/* hud */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.when{font-family:var(--display);font-size:24px;line-height:1}
.when small{font-size:15px;margin-left:4px}
.belt{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px;padding:4px 10px 4px 6px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.belt i{width:26px;height:9px;border-radius:2px;background:var(--b);border:1px solid rgba(255,255,255,.4)}
.hud .left{margin-left:auto;font-size:12.5px;color:var(--mute)}
.meters{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:12.5px}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--mute));width:var(--w)}
.mot{font-weight:700;padding:2px 10px;border-radius:999px;font-size:12.5px;display:inline-block}
.mot-0{background:#3b4a8a}.mot-1{background:#4f6aa8}.mot-2{background:#5d6582}.mot-3{background:#c9602f}.mot-4{background:var(--shu)}
.banner{background:linear-gradient(90deg,var(--gold),#f3d27a);color:#2a1e00;font-weight:700;border-radius:8px;padding:8px 12px;font-size:13.5px}
.banner.red{background:linear-gradient(90deg,#7a2a35,#5a2230);color:var(--fg)}
.chat{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--panel2);border-radius:12px;padding:10px 12px;border:1px solid var(--line);animation:up .35s both}
.chat .av{--s:50px}
.chat b{font-size:12.5px;color:var(--gold)}
.chat p{margin:0;font-size:14.5px;line-height:1.55}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.st{display:grid;grid-template-columns:5.6em 1.4em 1fr 2.2em;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.st .rk{font-family:var(--display);text-align:center}
.st .v{text-align:right;color:var(--mute)}
.rk-S{color:var(--gold)}.rk-A{color:#ff8a65}.rk-B{color:#ffb74d}.rk-C{color:#dce775}.rk-D{color:#81c784}.rk-E{color:#4fc3f7}.rk-F{color:#9fa8da}.rk-G{color:#78809a}

.practice{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pr{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:9px;background:var(--panel2);border:2px solid var(--line);min-width:0;position:relative}
.pr .tn{font-family:var(--display);font-size:22px;line-height:1}
.pr .tr{font-size:10.5px;color:var(--mute);text-align:center;line-height:1.25;min-height:2.5em}
.pr .avs{display:flex;flex-direction:column;gap:3px;min-height:90px;align-items:center}
.pr.on{border-color:var(--shu);background:#3a2433}
.pr .fr{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--gold);color:#2a1e00;font-size:10px;font-weight:700;padding:0 6px;border-radius:999px;white-space:nowrap}
.pr .ring{outline:2px solid var(--gold);outline-offset:1px;border-radius:50%}
.pv{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13.5px}
.pv b{color:var(--shu2)}
.warn{color:#ff9e80}
.log{display:flex;flex-direction:column;gap:4px;font-size:13px}
.log p{margin:0;padding-left:10px;border-left:2px solid var(--line)}
.log p:first-child{border-color:var(--shu);color:var(--fg)}
.log p:not(:first-child){color:var(--mute)}

/* modal / conversation */
#modal{position:fixed;inset:0;z-index:20;background:rgba(6,9,18,.72);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--panel);border:2px solid var(--fg);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:up .25s both}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.who{display:flex;gap:10px;align-items:center}
.who .av{--s:52px}
.who h3{font-size:17px}
.vn{cursor:pointer;display:flex;flex-direction:column;gap:10px;user-select:none}
.vn .who .av{animation:slidein .3s both}
@keyframes slidein{from{transform:translateX(-18px);opacity:0}to{transform:none;opacity:1}}
.say{font-size:15.5px;line-height:1.75;background:var(--panel2);border-radius:8px;padding:12px;min-height:3.6em;position:relative}
.say .nx{position:absolute;right:10px;bottom:4px;color:var(--gold);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.choices{display:flex;flex-direction:column;gap:8px}
.choices .btn{justify-content:flex-start;text-align:left}
.gain{color:var(--gold);font-weight:700}
.examBar{position:relative;height:16px;border-radius:8px;background:var(--panel2);overflow:hidden}
.examBar i{position:absolute;inset:0 auto 0 0;background:var(--shu);width:var(--w)}
.examBar s{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--gold);left:var(--l)}
.fight p{margin:0 0 4px}
.skills{display:flex;flex-direction:column;gap:6px}
.sk{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 10px;background:var(--panel2);border-radius:8px;border-left:4px solid var(--c)}
.sk .d{font-size:11.5px;color:var(--mute)}
.sk.own{opacity:.55}
.tag{font-size:10.5px;padding:1px 7px;border-radius:999px;font-weight:700;background:var(--c);color:#111}
.big{font-family:var(--display);font-size:64px;line-height:1}
table.rates{width:100%;border-collapse:collapse;font-size:13px}
table.rates td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
table.rates td:first-child{font-family:var(--display);white-space:nowrap}
table.rates td:last-child{text-align:right;white-space:nowrap}

/* ===== gacha effect ===== */
#fx{position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse at 50% 60%,#1d2547,#05070f 75%);overflow:hidden;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#fx .floor{position:absolute;left:0;right:0;bottom:0;height:34%;background:repeating-linear-gradient(90deg,#3b2a1c 0 58px,#33241a 58px 60px);transform:perspective(500px) rotateX(55deg);transform-origin:bottom}
#fx .stage{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto auto;max-width:620px;margin:0 auto}
#fx .arena{position:relative}
#fx .me{position:absolute;left:8%;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
#fx .me .av{--s:min(30vw,140px);transition:box-shadow .3s}
#fx .me .nm{font-family:var(--display);font-size:15px;margin-top:10px;background:rgba(0,0,0,.5);padding:2px 12px;border-radius:4px}
#fx .slot{position:relative;display:grid;place-items:center}
#fx .avw{display:grid}
#fx .aura{position:absolute;inset:-30px -40px;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .3s,box-shadow .3s}
#fx .aura.on{opacity:1}
#fx .aura.rainbow{animation:hue 1.2s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#fx .me.punch .slot{animation:punch .35s both}
@keyframes punch{40%{transform:translateX(32vw) scale(1.1)}100%{transform:none}}
#fx .tgt{position:absolute;right:8%;top:52%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;transition:opacity .4s,transform .4s}
#fx .tgt.in{opacity:1}
#fx .tgt .lbl{font-family:var(--display);font-size:16px;color:var(--fg);background:rgba(0,0,0,.5);padding:2px 12px;border-radius:4px}
#fx .tw{position:relative;width:min(34vw,170px);height:min(34vw,170px)}
#fx .half{position:absolute;inset:0;display:grid;place-items:center;transition:transform .5s cubic-bezier(.2,.8,.3,1),opacity .6s}
#fx .half.l{clip-path:inset(0 50% 0 0)}#fx .half.r{clip-path:inset(0 0 0 50%)}
#fx .tw.split .half.l{transform:translate(-26%,10%) rotate(-18deg)}
#fx .tw.split .half.r{transform:translate(26%,10%) rotate(18deg)}
#fx .tw.gone .half{opacity:0;transform:scale(.4)}
#fx .tw.wob{animation:wob .4s}
@keyframes wob{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#fx .crack{position:absolute;inset:0;opacity:0}
#fx .crack.on{opacity:1}
.tg{display:flex;flex-direction:column;gap:3px;align-items:center}
.tg.kawara i{display:block;width:min(30vw,150px);height:9px;border-radius:5px 5px 2px 2px;background:linear-gradient(#7d8597,#4d5466)}
.tg.ice i{display:block;width:min(28vw,140px);height:min(9vw,44px);background:linear-gradient(135deg,#dff6ff,#8fd3ef);border:1px solid #fff;opacity:.92}
.tg.ita i{display:block;width:min(30vw,150px);height:min(8vw,40px);background:repeating-linear-gradient(90deg,#d9a866 0 12px,#c8955a 12px 15px);border-radius:3px}
.tg.take i{display:block;width:min(6vw,30px);height:min(32vw,160px);background:linear-gradient(90deg,#4f9a3f,#9fd66b,#4f9a3f);border-radius:6px;box-shadow:inset 0 30px 0 -27px #2f6326,inset 0 -60px 0 -57px #2f6326}
.tg.stone{width:min(26vw,130px);height:min(20vw,100px);border-radius:46% 54% 40% 60%/55% 45% 55% 45%;background:radial-gradient(circle at 35% 30%,#a5a5a5,#5a5a5a)}
.tg.rock{width:min(33vw,165px);height:min(30vw,150px);clip-path:polygon(10% 30%,35% 5%,70% 10%,95% 40%,88% 90%,40% 100%,5% 80%);background:radial-gradient(circle at 40% 30%,#8a8178,#3e3832)}
.tg.suika{width:min(26vw,130px);height:min(26vw,130px);border-radius:50%;background:repeating-linear-gradient(100deg,#2f7d32 0 12px,#174d1c 12px 22px)}
#fx .parts i{position:absolute;width:12px;height:12px;border-radius:2px;left:var(--x);top:var(--y);background:var(--c);animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
#fx .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#fx .flash.go{animation:flash .5s}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#fx .flash.rb{background:conic-gradient(from 0deg,#ff4b3a,#ffd84a,#4cd17a,#3fa9f5,#b48cf0,#ff4b3a)}
#fx.shake .stage{animation:shk .35s}
@keyframes shk{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
#fx .cut{position:absolute;left:-10%;right:-10%;top:16%;text-align:center;font-family:var(--display);font-size:clamp(30px,10vw,62px);line-height:1.1;color:#fff;
  -webkit-text-stroke:2px #000;text-shadow:0 0 18px var(--ac,#ff4b3a),4px 4px 0 #000;transform:skewX(-10deg) translateX(110%);opacity:0;white-space:nowrap}
#fx .cut.go{animation:cut 1.1s both}
@keyframes cut{0%{transform:skewX(-10deg) translateX(110%);opacity:1}18%{transform:skewX(-10deg) translateX(0)}80%{transform:skewX(-10deg) translateX(-3%);opacity:1}100%{transform:skewX(-10deg) translateX(-110%);opacity:0}}
#fx .gauge{margin:0 20px 8px;display:flex;flex-direction:column;gap:6px}
#fx .gauge .lbl{font-family:var(--display);font-size:16px;color:var(--ac,#fff);text-shadow:0 0 10px var(--ac,#fff);min-height:1.4em}
#fx .gbar{height:16px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;border:1px solid rgba(255,255,255,.3)}
#fx .gbar i{display:block;height:100%;width:var(--w,0%);background:var(--ac,#fff);transition:width .3s,background .3s;box-shadow:0 0 14px var(--ac,#fff)}
#fx .gbar.rainbow i{background:linear-gradient(90deg,#ff4b3a,#ffd84a,#4cd17a,#3fa9f5,#b48cf0)}
#fx .msg{margin:0 20px calc(18px + env(safe-area-inset-bottom,0px));min-height:3.4em;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:10px 14px;font-size:16px;line-height:1.6;display:flex;gap:10px;align-items:center}
#fx .msg .av{--s:40px}
#fx .skip{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:2;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}

/* conversation bust */
.vn .bust{height:150px;display:flex;align-items:flex-end;margin:-6px 0 -10px}
.vn .bust svg{height:150px;width:150px;animation:slidein .3s both}
.vn .nameplate{display:inline-block;background:var(--shu);color:#fff;font-weight:700;font-size:13px;padding:2px 12px;border-radius:6px 6px 0 0;margin-bottom:-12px;position:relative;z-index:1;align-self:flex-start}
.vn .nameplate.none{background:var(--panel2);color:var(--mute)}
.chat .bust{width:64px;height:64px;border-radius:12px;background:linear-gradient(var(--panel),#3a3350);overflow:hidden;flex:none}
.chat .bust svg{width:100%;height:100%}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;margin:0 auto;z-index:26;display:flex;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--gold);border-radius:14px;padding:6px 14px 6px 6px;width:min(92vw,420px);animation:up .3s both;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.out{opacity:0;transition:opacity .4s}
.toast .tb{width:56px;height:56px;border-radius:10px;overflow:hidden;background:var(--panel2);flex:none}

#fx .aura2{position:absolute;left:50%;bottom:-6%;width:150%;height:150%;transform:translateX(-50%);pointer-events:none;opacity:0;transition:opacity .3s;z-index:0;
  --sz:calc(.55 + var(--lv,0) * .12)}

#fx .slot{isolation:isolate}#fx .avw{position:relative;z-index:1}

  background:radial-gradient(ellipse at 50% 85%,#fff 0 12%,var(--ac,#fff) 30%,transparent 72%);mix-blend-mode:screen;filter:blur(2px);transform-origin:50% 100%;animation:flame calc(.9s - var(--lv,0)*.08s) ease-in-out infinite}
#fx .aura2 i:nth-child(2){left:calc(50% - 40% * var(--sz));transform:rotate(-14deg);animation-delay:-.2s;height:calc(62% * var(--sz))}
#fx .aura2 i:nth-child(3){left:calc(50% - 4% * var(--sz));transform:rotate(14deg);animation-delay:-.45s;height:calc(64% * var(--sz))}
#fx .aura2 i:nth-child(4){left:calc(50% - 50% * var(--sz));transform:rotate(-24deg);animation-delay:-.6s;height:calc(46% * var(--sz))}
#fx .aura2 i:nth-child(5){left:calc(50% + 6% * var(--sz));transform:rotate(24deg);animation-delay:-.3s;height:calc(48% * var(--sz))}
#fx .aura2 i:nth-child(6){left:calc(50% - 14% * var(--sz));width:calc(28% * var(--sz));height:calc(96% * var(--sz));animation-delay:-.1s}
#fx .aura2 i:nth-child(7){left:calc(50% - 30% * var(--sz));width:calc(60% * var(--sz));height:calc(40% * var(--sz));animation-delay:-.7s;opacity:.8}

/* villain intro: gekiga cut-in */
.vil{position:fixed;inset:0;z-index:44;background:#07070b;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;cursor:pointer;animation:vilin .25s both}
.vil.out{opacity:0;transition:opacity .3s}
.vil-rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,#e5483a 0 3deg,#14050a 3deg 9deg);animation:spin 30s linear infinite;opacity:.55}
.vil::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 20%,rgba(0,0,0,.85) 80%);z-index:1}
.vil-fig{position:relative;z-index:2;height:80vh;display:flex;align-items:flex-end;animation:vilrise .9s cubic-bezier(.2,.9,.3,1) both;filter:drop-shadow(0 0 24px rgba(0,0,0,.8))}
.vil-fig img{height:100%;width:auto;max-width:92vw;object-fit:contain;image-rendering:auto}
.vil-go{position:absolute;z-index:3;top:9%;left:0;right:0;text-align:center;font-family:var(--display);font-size:clamp(34px,10vw,64px);color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke;text-shadow:0 0 18px #e5483a;transform:skewX(-8deg);animation:vilgo 1.2s .3s both}
.vil-name{position:absolute;z-index:3;bottom:7%;left:6%;font-family:var(--display);font-size:clamp(20px,6vw,34px);background:var(--shu);color:#fff;padding:4px 18px;transform:skewX(-8deg);box-shadow:5px 5px 0 #000;animation:up .5s .6s both}
.vil-tap{position:absolute;z-index:3;bottom:2%;right:5%;color:#fff;font-size:12px;opacity:.8;animation:blink 1.2s infinite}
@keyframes vilin{from{opacity:0}}
@keyframes vilrise{from{transform:translateY(40%) scale(.9);opacity:0}}
@keyframes vilgo{0%{opacity:0;transform:skewX(-8deg) scale(1.8)}30%{opacity:1;transform:skewX(-8deg) scale(1)}100%{opacity:1;transform:skewX(-8deg) scale(1)}}

function headSVG(a,cx,cy,expr,sk){

 }};

 return hairSVG(a,cx,cy,'back')+ears+face+bl+beard+eyes+mouth+mask+glasses+hairSVG(a,cx,cy,'front')+brows+browsOver+band+scar+hat;

const HASK=/[\u4e00-\u9fff々]/;
const SKIPTAG=new Set(['RUBY','RT','SCRIPT','STYLE','TEXTAREA','INPUT','SVG','CANVAS','svg','text','tspan']);
function furiDOM(root){if(!G||G.furi===false||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{if(!HASK.test(n.nodeValue))return 2;
  for(let e=n.parentNode;e&&e!==document.body;e=e.parentNode){if(SKIPTAG.has(e.nodeName)||(e.classList&&(e.classList.contains('rb')||e.classList.contains('rt')))||(e.dataset&&(e.dataset.typing||e.dataset.nofuri!==undefined)))return 2}return 1}});

const KEY='karate-spirits-v3';
let G=null;
function fresh(){return {screen:'title',stones:5000,col:{kokoro:0,kizuna:0},deck:['kokoro'],me:{base:'kizuna',look:'self',name:'きずな'},run:null,pulled:[],newIds:[],snd:true,voice:true,fxOn:true,furi:true,roster:[]}}
/* Save data lives in TWO places: this browser (localStorage) and the artifact database (per-viewer private doc),
   so republishing the page or opening it in another browser never loses progress. */
const LEGACY=['kumite-densetsu-v2'];
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}
  for(const k of LEGACY){try{const s=localStorage.getItem(k);if(s){const o=JSON.parse(s);if(o&&o.col)return o}}catch(e){}}return null}
let DBREF=null,dbTimer=null,dbBusy=false,dbSig='';
const sigOf=()=>{try{return JSON.stringify(G,(k,v)=>k==='_t'?undefined:v)}catch(e){return ''}};
const meaningful=()=>!!(G&&(G.run||(G.roster&&G.roster.length)||Object.keys(G.col||{}).length>2||G.stones!==5000));
function save(){try{G._t=Date.now();localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}dbQueue()}
function dbQueue(){if(!DBREF)return;clearTimeout(dbTimer);dbTimer=setTimeout(dbFlush,1500)}
async function dbFlush(){if(!DBREF||dbBusy||!G)return;const s=sigOf();if(!s||s===dbSig||s.length>240000||!meaningful())return;dbBusy=true;try{G._t=G._t||Date.now();await DBREF.set({t:G._t,json:JSON.stringify(G)});dbSig=s}catch(e){}dbBusy=false;if(sigOf()!==dbSig)dbQueue()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)dbFlush()});
function adoptSave(r){G=r;const f=fresh();for(const k in f)if(G[k]===undefined)G[k]=f[k];if(!G.me.name)G.me.name=P()==='kizuna'?'きずな':'こころ';refreshNames();if((G.screen==='main'||G.screen==='reg')&&!G.run)G.screen='title';normDeck();try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}dbSig=sigOf();render()}
async function dbInit(){try{const cl=window.claude;if(!cl||!cl.use)return;const [u,db]=await Promise.all([cl.use('user'),cl.use('db')]);const id=u&&await u.id();if(!db||!id)return;
  DBREF=db.doc('data/users/'+id+'/save');const snap=await DBREF.get();const lt=(G&&G._t)||0;
  if(snap.exists){const d=snap.data()||{};let r=null;try{r=JSON.parse(d.json)}catch(e){}
    const dt=d.t||0,useDb=lt>0?dt>lt+1000:!meaningful();
    if(r&&r.col&&useDb)adoptSave(r);else if(meaningful()){dbSig='';dbQueue()}}
  else if(meaningful()){dbSig='';dbQueue()}
}catch(e){}}

const volSE=()=>Math.pow((G.vse??45)/100,1.6),volBGM=()=>Math.pow((G.vbgm??30)/100,1.6)*.7;
function applyVol(){if(!AC)return;SFXOUT.gain.setTargetAtTime(volSE(),AC.currentTime,.05);MUSIC.gain.setTargetAtTime(volBGM(),AC.currentTime,.05);Object.values(bgmEl).forEach(a=>{if(!a._src)a.volume=volBGM()})}
function noiseSrc(c,d){const b=c.createBuffer(1,Math.max(1,c.sampleRate*d|0),c.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;return s}
function env(c,node,t,peak,dur){const g=c.createGain();g.gain.setValueAtTime(peak,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);node.connect(g).connect(SFXOUT);return g}
function taiko(i=0){const c=ac();if(!c)return;const t=c.currentTime,o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(130+i*10,t);o.frequency.exponentialRampToValueAtTime(46,t+.32);env(c,o,t,.9,.5);o.start(t);o.stop(t+.55);const n=noiseSrc(c,.05);env(c,n,t,.3,.05);n.start(t)}

function thudS(){const c=ac();if(!c)return;const t=c.currentTime,o=c.createOscillator();o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(35,t+.25);env(c,o,t,.9,.3);o.start(t);o.stop(t+.35)}
function chime(){const c=ac();if(!c)return;const t=c.currentTime;[784,988,1175,1568,1976].forEach((f,i)=>{const o=c.createOscillator();o.type='triangle';o.frequency.value=f;env(c,o,t+i*.09,.35,.9);o.start(t+i*.09);o.stop(t+i*.09+1)})}

function kiaiS(p=1){const c=ac();if(!c)return;const t=c.currentTime,o=c.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(270*p,t);o.frequency.exponentialRampToValueAtTime(150*p,t+.3);const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1.6,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.34);[[800,5],[1250,7],[2600,6]].forEach(([fq,q])=>{const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=fq;f.Q.value=q;o.connect(f);f.connect(g)});g.connect(SFXOUT);o.start(t);o.stop(t+.36)}
function stepS(n=5){const c=ac();if(!c)return;const t=c.currentTime;for(let k=0;k<n;k++){const s=noiseSrc(c,.06),f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=900+(k%2)*300;s.connect(f);env(c,f,t+k*.1,.5,.06);s.start(t+k*.1)}}

function coinS(){const c=ac();if(!c)return;const t=c.currentTime;[[1319,0],[1760,.07]].forEach(([fq,d])=>{const o=c.createOscillator();o.type='square';o.frequency.value=fq;env(c,o,t+d,.12,.25);o.start(t+d);o.stop(t+d+.3)})}

function roll(minSR){let x=Math.random()*100,r='N',acc=0;for(const [k,p] of RATES){acc+=p;if(x<acc){r=k;break}}if(minSR&&(r==='R'||r==='N'))r='SR';return pick(POOL(r))}
function pull(n){
  const cost=n===10?1500:150;if(G.stones<cost)return;

function spar(oppId,src,after){const pw=src?Math.round(power(src.st,src.skills)*.9):G.run?Math.round(power()*.9):55;const en=oppFighter(oppId,pw);en.lvl=.45;

/* ================= tournaments ================= */
const TCLS=[{n:'初級の部',pw:[14,24,30],bl:[1,3]},{n:'中級の部',pw:[38,50,58],bl:[5,7]},{n:'上級の部',pw:[66,78,88],bl:[9,11]}];
const TNAT={n:'全国大会',pw:[96,101,107],bl:[11,11]},TWORLD={n:'世界大会',pw:[120,120,135],bl:[11,11]};
const ROUNDS=['準々決勝','準決勝','決勝'];
const TNAMES=['北辰会のレオ','明光道場のナナミ','紅陽会のタイガ','青龍館のハルト','白波塾のミオ','若獅子会のリク','琉風道場のソウタ','海星館のアオイ','黒潮道場のカイト','南風会のユイ','翔空会のツバサ','鳳凰館のヒカル','大樹会のダイチ','月光道場のルナ','疾風塾のカケル','雷光館のライ'];
const WNAMES=['ブラジルのマテウス','フランスのルカ','アメリカのジェイク','オランダのダーン','韓国のジフン','オーストラリアのノア','カナダのエマ','スペインのパブロ','インドのアルジュン','ケニアのキプロノ'];
function tourOpp(pw,belt,world){const nm=pick(world?WNAMES:TNAMES);
  const art={sk:world?R(0,3):R(0,2),hair:pick(['short','spiky','bob','pony','topknot']),hc:pick(world?['#222','#3a2a1a','#c9a35a','#8a4b2a']:['#222','#3a2a1a','#4a3426']),eye:pick(['dot','sharp','sharp']),belt:BELTS[belt].c,small:pw<60?1:0,sex:/ナナミ|ミオ|アオイ|ユイ|ルナ|エマ/.test(nm)?'f':undefined};
  const skills=['seiken','gedan','maegeri'];if(pw>=35)skills.push('hiza','mikazuki');if(pw>=50)skills.push('jodan','onetwo');if(pw>=65)skills.push('ushirogeri','renzoku');if(pw>=90)skills.push(pick(['kakato','ushiromawashi','domawashi']));if(pw>=110)skills.push(pick(['tobiushiro','kyukyoku']));if(pw>=130)skills.push('ushiromawashi','kakato','kyukyoku','osu','tetsu','gyakkyo');
  {const u=[...new Set(skills)];skills.length=0;skills.push(...u)}
  const st={};STATS.forEach(([k])=>st[k]=world?pw:clamp(Math.round(pw+R(-6,6)),5,120));
  return {name:nm,art,st,skills,vid:art.sex==='f'?'dojoKid2':'enemyKid',belt:world?'世界代表':beltName(belt),portrait:artSVG(art,'idle','grit','bust'),pow:pw}}
function tourOf(r){const m=monthOf(r.t),g=gradeOf(r.t);
  if(m===6||m===10)return {kind:'local',...TCLS[r.cls||0],cls:r.cls||0};
  if(m===1&&r.natQ)return {kind:'nat',...TNAT};
  if(m===2&&r.worldQ&&[2,4,6].includes(g))return {kind:'world',...TWORLD};
  return null}
const PLACE=['ベスト8','3位','準優勝','優勝'];
function tournament(next){
  const r=G.run,T=tourOf(r);if(!T)return next();
  const used=new Set();const opps=T.pw.map((pw,i)=>{const pk=T.kind==='world'?pw:Math.max(pw,Math.round(power()*(T.kind==='nat'?[.9,1.0,1.05][i]:[.8,.9,1.0][i])));if(T.kind==='world'&&i===2){const o=tourOpp(pw,11,true);o.name='世界王者 '+o.name.replace(/^.+?の/,'');o.belt='世界王者';return o}let o;do{o=tourOpp(pk+R(-2,2),clamp(T.bl[0]+(i>0?1:0),0,11),T.kind==='world')}while(used.has(o.name)&&used.size<10);used.add(o.name);return o});
  bgm('battle');taiko(3);
  const intro=T.kind==='world'?[{who:null,t:'世界中の空手家が集まる、世界大会の会場。'},{who:'kancho',t:'「ここが世界の舞台だ。……楽しんでこい」'}]
   :T.kind==='nat'?[{who:null,t:'全国から強い選手が集まる、全国大会の日。'},{who:'kancho',t:'「全国の舞台だ。いつもの稽古を信じろ」'}]
   :[{who:null,t:`空手の大会の日。今日は「${T.n}」に出場する。`},{who:'kancho',t:T.cls===0?'「初めての大会だな。勝ち負けより、まずは礼をしっかり」':'「優勝すれば、次はひとつ上の部だ」'}];
  show({lines:[...intro,{who:PART(),t:'「がんばってね！ 応援してるよ！」'},{who:'me',t:'「押忍！」'}],title:`${T.n}`,
    html:`<div class="small mute">試合時間は1分30秒。時間切れは体力が多く残っているほうの勝ち。<br>準々決勝・準決勝はオートでも戦えますが、<b>決勝は自分で戦います</b>。</div>`,
    choices:[{label:'試合会場へ',fn:()=>setTimeout(()=>round(0),30)}]});
  function round(i){const o=opps[i],fin=i===2;
    const go=(manual)=>{if(manual){fightRT({me:myFighter(),en:{...o,lvl:T.kind==='world'?(fin?.97:.9):clamp(.52+(o.pow-power())/45,.4,.96)},title:`${ROUNDS[i]}　vs ${o.name}`,bg:T.kind==='world'?'world':T.kind==='nat'?'nat':'local',finalIntro:fin&&T.kind!=='local',noQuit:1,time:30,clock:3,onEnd:(win,how)=>after(i,win,how)})}
      else{const win=autoFight(o.pow);setTimeout(()=>after(i,win,win?'判定勝ち':'判定負け'),900)}};
    show({who:null,title:`${ROUNDS[i]}`,html:`<div class="vsrow">${av('me',48)}<b class="vsx">VS</b><span class="av" style="--s:48px">${o.portrait}</span></div><div style="text-align:center"><b>${o.name}</b><div class="small mute">${o.belt}・強さ ${rk(o.pow)}　（あなたの戦力 ${rk(Math.round(power()))}）</div></div>`,
      choices:fin?[{label:'決勝！ 自分で戦う',fn:()=>setTimeout(()=>go(true),30)}]:[{label:'自分で戦う',fn:()=>setTimeout(()=>go(true),30)},{label:'オートで戦う',fn:()=>setTimeout(()=>go(false),30)}]})}
  function after(i,win,how){if(win)r.wins++;
    if(win&&i<2){okS();show({lines:[{who:'me',t:pick(['「押忍！」','「よしっ！」','「押忍！！ 次！」'])}],title:`${ROUNDS[i]} 勝利！（${how}）`,choices:[{label:`${ROUNDS[i+1]}へ`,fn:()=>setTimeout(()=>round(i+1),30)}]});return}
    const place=win?3:i;
    if(i===2&&(T.kind==='nat'||T.kind==='world')){podium(T.kind,win,opps[2],()=>result(place,how));return}
    result(place,how)}
  function result(place,how){
    const pt=[[10,10,10],[25,20,15],[35,30,20],[50,40,30]][place].map(v=>Math.round(v*(T.kind==='world'?2:T.kind==='nat'?1.6:1+(T.cls||0)*.3)));addPt({body:pt[0],tech:pt[1],mind:pt[2]});
    r.trophies=r.trophies||[];if(place>=1)r.trophies.push(`小${gradeOf(r.t)} ${T.n} ${PLACE[place]}`);
    let up='';
    if(T.kind==='local'&&place===3&&T.cls<2){r.cls=T.cls+1;up=`次から「${TCLS[r.cls].n}」に出場！`}
    if(T.kind==='local'&&T.cls===2&&place===3){r.natQ=true;up='全国大会（1月）への出場が決まった！'}
    if(T.kind==='nat'){r.natQ=false;if(place===3){r.worldQ=true;up=[2,4,6].includes(gradeOf(r.t))?'世界大会（2月）への出場が決まった！':'世界大会への出場権を手に入れた！（世界大会は2・4・6年生の2月）'}}
    if(T.kind==='world'){r.worldQ=false}
    if(place>=2)r.mot=Math.min(4,r.mot+1);if(place===0)r.mot=Math.max(0,r.mot-1);
    setTimeout(place===3?fanfareS:place>=1?chime:failS,200);
    log(`${T.n}で${PLACE[place]}！`);
    const L=place===3?[{who:PART(),t:T.kind==='world'?'「世界一だよ！！ すごすぎる！！」':'「優勝おめでとう！！」'},{who:'kancho',t:T.kind==='world'?'「……見事だ。お前は世界一の空手家だ」':'「よくやった。だが勝っておごるなよ」'},{who:'me',t:'「押忍！！」'}]
      :place>=1?[{who:PART(),t:`「${PLACE[place]}、おめでとう！」`},{who:'me',t:'「押忍！ 次はもっと上を目指す！」'}]
      :[{who:PART(),t:'「くやしいね……。次はきっと勝てるよ」'},{who:'kancho',t:'「負けて腐らず。負けた試合こそ、いちばんの先生だ」'}];
    show({lines:L,title:`${T.n}　${PLACE[place]}${place===3?'！！':''}`,html:`<div class="medal m${place}">${['','🥉','🥈','🏆'][place]}</div><div class="gain">体+${pt[0]}　技+${pt[1]}　心+${pt[2]}</div>${up?`<div class="banner">${up}</div>`:''}`,then:()=>{bgm('title');next()}});
  }
}

/* ================= stat-up & skills ================= */
/* 能力アップのコスト：高い能力ほど急に重くなる。得意は安く、苦手は高い。学年ごとに上限あり */
const baseCost=v=>1+Math.floor(v/12)+(v>=80?Math.floor((v-70)/10):0)+(v>=100?2:0);
const talOf=(r,k)=>r.tal?(r.tal.good.includes(k)?'good':r.tal.bad.includes(k)?'bad':''):'';
const stCost=(v,k,r)=>{r=r||G.run;const t=talOf(r,k);return Math.max(1,Math.ceil(baseCost(v)*(t==='good'?.75:t==='bad'?1.35:1)))};
const capOf=r=>r.t>=TOTAL?120:Math.min(120,35+gradeOf(r.t)*14+(gradeOf(r.t)>=6?1:0));
function makeTalent(){const good=P()==='kizuna'?['chi','tough']:['flex','spd'];const rest=STATS.map(([k])=>k).filter(k=>!good.includes(k));
  const g3=pick(rest);const bad=pick(rest.filter(k=>k!==g3));return {good:[...good,g3],bad:[bad]}}
const talMark=(r,k)=>{const t=talOf(r,k);return t==='good'?'<i class="tal g" title="得意">得</i>':t==='bad'?'<i class="tal b" title="苦手">苦</i>':''};
function statUp(onClose){
  const r=G.run;let tab='st';if(!r.tal)r.tal=makeTalent();
  const draw=()=>{const cap=capOf(r);
    const pts=`<div class="ptrow">${Object.keys(PTN).map(k=>`<span class="pt" style="--c:${PTC[k]}"><b>${PTN[k]}</b><span class="num">${r.pt[k]||0}</span></span>`).join('')}</div>`;
    const stHTML=STATS.map(([k,n])=>{const v=r.st[k],c=stCost(v,k),cat=PCAT[k],can=(r.pt[cat]||0)>=c&&v<cap;let c5=0,vv=v;for(let i=0;i<5;i++){c5+=stCost(vv,k);vv++}
      return `<div class="sup"><span class="sn">${n}${talMark(r,k)}</span><span class="rk rk-${rk(v)}">${rk(v)}</span><span class="num sv">${v}</span><div class="bar"><i style="--w:${v/120*100}%;--c:${PTC[cat]}"></i><b class="capl" style="--cap:${cap/120*100}%"></b></div><span class="small mute num">${v>=cap?'上限':PTN[cat]+c}</span><button class="btn sm up1" data-up="${k}" data-n="1" ${can?'':'disabled'}>+1<small class="bsub">${v>=cap?'上限':PTN[cat]+c}</small></button><button class="btn sm" data-up="${k}" data-n="5" ${(r.pt[cat]||0)>=c5&&v+5<=cap?'':'disabled'}>+5</button></div>`}).join('');
    const skHTML=['w','b','s','g'].map(g=>`<div class="label">${SKG[g]}</div>`+Object.keys(SK).filter(k=>SK[k].g===g).map(k=>{const s=SK[k],own=r.skills.includes(k),kt=r.kotsu[k]||0,cost=skCostK(k);
      let note='';if(s.g==='g'&&!kt&&!own)note='（コツが必要）';
      return `<div class="sk ${own?'own':''}" style="--c:${SKC[g]}"><div><div style="font-weight:700">${s.n}${kt&&!own?` <span class="tag" style="--c:var(--gold)">コツLv${kt}</span>`:''}</div><div class="d">${s.d}${note}</div></div>
      ${own?'<span class="small mute">習得済</span>':`<button class="btn sm" data-buy="${k}" ${canBuy(k)?'':'disabled'}>${Object.entries(cost).map(([c,v])=>`${PTN[c]}${v}`).join(' ')}</button>`}</div>`}).join('')).join('');
    modal.innerHTML=`<div class="dlg"><div class="hud"><h2 style="font-size:20px">能力アップ</h2></div>${pts}
      <div class="tabs"><button class="tab ${tab==='st'?'on':''}" data-tab="st">能力</button><button class="tab ${tab==='sk'?'on':''}" data-tab="sk">技を覚える</button></div>
      ${tab==='st'?`<div class="small mute">いまの上限は <b class="gain">${cap}</b>${r.t<TOTAL?`（小${gradeOf(r.t)}）。学年が上がると上限も上がります`:''}。能力が高いほど必要なポイントが急に増えます。<i class="tal g">得</i>得意は安く、<i class="tal b">苦</i>苦手は高くつきます。</div><div class="sups">${stHTML}</div><button class="btn" data-auto>おまかせで振り分け</button>`:`<div class="small mute">コツ1レベルごとに必要ポイントが20%下がる。必殺技はSSRキャラのイベントを最後まで見るか、コツを集めて習得。</div><div class="skills">${skHTML}</div>`}
      <div class="choices"><button class="btn main" data-close>もどる</button></div></div>`;
    modal.hidden=false;
    modal.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw()});
    modal.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const k=b.dataset.up,n=+b.dataset.n,cat=PCAT[k];for(let i=0;i<n;i++){const c=stCost(r.st[k],k);if((r.pt[cat]||0)<c||r.st[k]>=cap)break;r.pt[cat]-=c;r.st[k]++}coinS();save();draw()});
    const au=$('[data-auto]',modal);if(au)au.onclick=()=>{const st={...r.st},pt={...r.pt};let moved=true;const w=k=>st[k]-(talOf(r,k)==='good'?8:talOf(r,k)==='bad'?-6:0);
      while(moved){moved=false;STATS.map(([k])=>k).sort((a,b)=>w(a)-w(b)).forEach(k=>{const cat=PCAT[k],c=stCost(st[k],k);if((pt[cat]||0)>=c&&st[k]<cap){pt[cat]-=c;st[k]++;moved=true}})}
      const ups=STATS.filter(([k])=>st[k]>r.st[k]);popS();
      modal.innerHTML=`<div class="dlg"><h2 style="font-size:20px">おまかせで振り分けると…</h2>${ups.length?`<div class="small mute">こんな感じに上がります</div><div class="prev">${ups.map(([k,n])=>`<div class="pv-row"><span>${n}</span><span class="rk rk-${rk(r.st[k])}">${rk(r.st[k])}</span><span class="num mute">${r.st[k]}</span><span class="arr">▶</span><span class="rk rk-${rk(st[k])}">${rk(st[k])}</span><b class="num gain">${st[k]}</b><span class="num gain small">+${st[k]-r.st[k]}</span></div>`).join('')}</div><div class="small mute">のこるポイント：${Object.keys(PTN).map(c=>`${PTN[c]}${pt[c]||0}`).join('　')}</div>`:'<div class="small mute">ポイントが足りないか、すべて上限なので、上げられる能力がありません。</div>'}
        <div class="choices">${ups.length?'<button class="btn main osu" data-ok>押忍！</button>':''}<button class="btn" data-no>やめる</button></div></div>`;
      const ok=$('[data-ok]',modal);if(ok)ok.onclick=()=>{Object.assign(r.st,st);Object.assign(r.pt,pt);sayV('me','osu');fanfareS();save();draw()};
      $('[data-no]',modal).onclick=()=>{clickS();draw()}};
    modal.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const k=b.dataset.buy;if(!canBuy(k))return;const cost=skCostK(k);for(const c in cost)r.pt[c]-=cost[c];r.skills.push(k);log&&G.run.log&&log(`「${SK[k].n}」を習得した！`);SK[k].g==='g'?fanfareS():coinS();save();draw()});
    $('[data-close]',modal).onclick=()=>{modal.hidden=true;save();render();onClose&&onClose()};
  };draw();
}
function skCostK(k){const r=G.run,base=skCost(k),m=1-.2*(r.kotsu[k]||0),o={};for(const c in base)o[c]=Math.round(base[c]*m);return o}
function canBuy(k){const r=G.run,s=SK[k];if(r.skills.includes(k))return false;if(s.g==='g'&&!(r.kotsu[k]>0))return false;if(s.req)for(const q in s.req)if(r.st[q]<s.req[q])return false;const c=skCostK(k);for(const x in c)if((r.pt[x]||0)<c[x])return false;return true}

  <div class="small mute">絆80以上で、そのキャラの得意稽古に一緒に入ると友情稽古になります。</div><div class="choices"><button class="btn main" data-close>もどる</button></div></div>`;

  <div class="menu"><button class="btn main" data-a="pvgo">対戦スタート！</button></div>`}
function pvGo(){const a=pvFighter(PV.a,PV.pw),b=pvFighter(PV.b,PV.pw);if(PV.a===PV.b)b.name=b.name+'（2P）';
  fightRT({me:a,en:b,pvp:1,title:`2人対戦　${a.name} vs ${b.name}`,bg:'local',
    onEnd:(win,how)=>{if(!how){G.screen='pvp';render();return}
      show({lines:[],title:`${win?'1P':'2P'}の勝ち！（${how}）`,html:`<div class="small mute">${win?a.name:b.name} の勝利。礼をして、もう一度やってみよう。</div>`,

const A={
  go:v=>{G.screen=v;if(v!=='gacha'){G.pulled=[];G.newIds=[]}save();render();window.scrollTo(0,0)},
  cont:()=>{G.screen='main';render()},
  base:v=>{const nm=$('#nm');G.me.base=v;G.me.look='self';if(!nm||!nm.value||nm.value==='きずな'||nm.value==='こころ')G.me.name=v==='kizuna'?'きずな':'こころ';normDeck();save();render()},
  look:v=>{G.me.look=v;save();render()},
  decide:()=>{const nm=$('#nm');G.me.name=(nm&&nm.value.trim())||(P()==='kizuna'?'きずな':'こころ');const others=Object.keys(G.col).filter(id=>!C[id].fixed&&!C[id].hide);G.screen=others.length?'deck':'gacha';save();render();window.scrollTo(0,0)},
  pull:v=>pull(+v),
  tog:id=>{const i=G.deck.indexOf(id);if(i>=0)G.deck.splice(i,1);else if(G.deck.length<6)G.deck.push(id);save();render()},
  auto:()=>{const o=Object.keys(G.col).filter(id=>id!==P()&&id!==PART()&&!C[id].hide).sort((a,b)=>(RORD.indexOf(C[a].r)-RORD.indexOf(C[b].r))||(lb(b)-lb(a)));G.deck=[PART(),...o.slice(0,5)];save();render()},
  start:()=>startRun(),
  sel:v=>{if(G.run.inj>0)return;clickS();G.run.sel=G.run.sel===v?null:v;render()},
  train:()=>doTrain(),rest:()=>doRest(),clinic:()=>doClinic(),out:()=>doOut(),
  furi:()=>{G.furi=G.furi===false;save();render()},
  stat:()=>statUp(),bonds:()=>bonds(),sound:()=>soundPanel(),
  spar:()=>{const pool=G.deck.filter(id=>C[id].t!=='sup');spar(pick(pool.length?pool:[PART()]),null,()=>{})},
  fight:id=>{const src=G.kfighter!=null?G.roster[G.kfighter]:null;spar(id,src,()=>{})},
  pva:v=>{PV.a=v;render()},pvb:v=>{PV.b=v;render()},pvw:v=>{PV.pw=+v;render()},pvgo:()=>pvGo(),
  rview:i=>rosterView(+i),
  rfight:i=>{G.kfighter=+i;G.screen='kumite';save();render()},
  rlook:v=>{const nm=$('#rnm');if(nm)G.me.name=nm.value.trim()||G.me.name;G.me.look=v;save();render()},
  register:()=>{const r=G.run,nm=$('#rnm');G.me.name=(nm&&nm.value.trim())||PS();
    const s=r.st,sum=Object.values(s).reduce((a,b)=>a+b,0)+r.skills.reduce((a,k)=>a+SK[k].bp,0)*3;const grade=sum>=980?'S':sum>=850?'A':sum>=720?'B':sum>=590?'C':sum>=460?'D':'E';
    G.roster.unshift({name:G.me.name,base:P(),look:G.me.look,art:meArt(),st:{...s},skills:[...r.skills],belt:r.belt,grade,trophies:[...(r.trophies||[])]});G.roster=G.roster.slice(0,20);
    G.stones+=600;G.run=null;G.screen='roster';save();render();fanfareS();sayV('me','osu')},
};
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;A[b.dataset.a]&&A[b.dataset.a](b.dataset.v)});

/* ================= boot ================= */
const boot=d=>{G=(d&&d.G)||load()||fresh();const f=fresh();for(const k in f)if(G[k]===undefined)G[k]=f[k];
  if(!G.me.name)G.me.name=P()==='kizuna'?'きずな':'こころ';refreshNames();
  if(G.screen==='main'&&!G.run)G.screen='title';if(G.screen==='reg'&&!G.run)G.screen='title';normDeck();probe();render();dbInit()};
window.claude?.hot?.snapshot?.(()=>({G}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});

})();
</script>
